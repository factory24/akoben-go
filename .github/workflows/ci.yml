name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -cover ./...
      # Standard-library packages report no module, and the stdlib's own
      # vendored golang.org/x copies are packages, not modules — so this asks
      # about modules, not import paths.
      - name: the package depends on nothing but the standard library
        run: |
          mods=$(go list -deps -f '{{with .Module}}{{.Path}}{{end}}' ./... |
                 sort -u | grep -v '^github.com/factory24/akoben-go$' | grep -v '^$' || true)
          if [ -n "$mods" ]; then echo "external modules appeared:"; echo "$mods"; exit 1; fi
